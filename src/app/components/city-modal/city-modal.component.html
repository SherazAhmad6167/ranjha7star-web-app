<div class="cim-wrapper">

  <!-- ── Header ── -->
  <div class="cim-header">
    <div class="cim-header-left">
      <div class="cim-header-icon"><i class="ri-building-2-line"></i></div>
      <div>
        <h4 class="cim-title">{{ editMode ? 'Update' : 'Add' }} City</h4>
        <p class="cim-subtitle">{{ editMode ? 'Edit city details below' : 'Fill in the city details below' }}</p>
      </div>
    </div>
    <button class="cim-close-btn" type="button" (click)="activeModal.dismiss()">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <!-- ── Loading overlay ── -->
  <div *ngIf="isLoading" class="cim-loading">
    <div class="spinner-border" style="color:#65a30d" role="status"></div>
    <span>Loading...</span>
  </div>

  <!-- ── Body ── -->
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="cim-body">

      <!-- Section: City Details -->
      <div class="cim-section">
        <div class="cim-section-head">
          <div class="cim-section-icon si-lime"><i class="ri-building-2-line"></i></div>
          <span class="cim-section-title">City Details</span>
        </div>
        <div class="cim-section-body">
          <div class="row g-3">

            <div class="col-md-6 col-12">
              <label class="cim-label">Country <span class="req">*</span></label>
              <select class="cim-input cim-select"
                [class.cim-invalid]="userForm.get('country')?.invalid && userForm.get('country')?.touched"
                formControlName="country">
                <option value="" disabled>Select a Country</option>
                <option value="pakistan">Pakistan</option>
              </select>
              <span class="cim-err"
                *ngIf="userForm.get('country')?.hasError('required') && userForm.get('country')?.touched">
                Select a Country
              </span>
            </div>

            <div class="col-md-6 col-12">
              <label class="cim-label">City <span class="req">*</span></label>
              <input type="text" class="cim-input"
                [class.cim-invalid]="userForm.get('city')?.invalid && userForm.get('city')?.touched"
                formControlName="city" placeholder="Enter City">
              <span class="cim-err"
                *ngIf="userForm.get('city')?.hasError('required') && userForm.get('city')?.touched">
                City is required
              </span>
            </div>

          </div>
        </div>
      </div>

    </div>

    <!-- ── Footer ── -->
    <div class="cim-footer">
      <button type="button" class="cim-btn cim-btn-cancel" (click)="activeModal.close()">
        Cancel
      </button>
      <button type="submit" class="cim-btn cim-btn-save" [disabled]="isLoading || isSaving">
        <span *ngIf="!isSaving">
          <i class="ri-save-line me-1"></i>{{ editMode ? 'Update' : 'Save' }}
        </span>
        <span *ngIf="isSaving" class="d-flex align-items-center gap-2">
          <span class="spinner-border spinner-border-sm" role="status"></span>
          {{ editMode ? 'Updating...' : 'Saving...' }}
        </span>
      </button>
    </div>
  </form>

</div>
