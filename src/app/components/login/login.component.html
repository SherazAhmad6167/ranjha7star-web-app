<div class="lg-page" [class.is-warping]="success">

    <!-- ═══ Space backdrop: stars speed up as the form fills, warp on sign-in ═══ -->
    <div class="lg-space" aria-hidden="true">
        <span class="lg-orb lg-orb-1"></span>
        <span class="lg-orb lg-orb-2"></span>
        <span class="lg-orb lg-orb-3"></span>
        <canvas class="lg-stars" warpField [warpSpeed]="starSpeed" [warp]="success"></canvas>
    </div>

    <div class="lg-shell">

        <!-- ═══ Brand ═══ -->
        <div class="lg-brand">
            <div class="lg-core" aria-hidden="true">
                <span class="lc-wave"></span>
                <span class="lc-wave"></span>
                <span class="lc-wave"></span>
                <span class="lc-orbit lc-orbit-1"><span class="lc-packet"></span></span>
                <span class="lc-orbit lc-orbit-2"><span class="lc-packet"></span></span>
                <span class="lc-ring"></span>
                <img src="assets/ranjha-logo3.jpeg" alt="">
            </div>

            <span class="lg-eyebrow">{{ greeting }}</span>
            <h1 class="lg-name">Ranjha<span>7star</span></h1>
            <p class="lg-tagline" aria-live="off">
                <span *ngFor="let t of [tagline]">{{ t }}</span>
            </p>

            <ul class="lg-features">
                <li><i class="ri-group-line"></i>Customers</li>
                <li><i class="ri-bill-line"></i>Billing</li>
                <li><i class="ri-router-line"></i>MikroTik</li>
                <li><i class="ri-bar-chart-2-line"></i>Analytics</li>
            </ul>
        </div>

        <!-- ═══ Sign-in card ═══ -->
        <div class="lg-card-wrap">
            <div class="lg-card" [class.is-shaking]="shake" (animationend)="onCardAnimationEnd($event)">

                <header class="lg-head">
                    <div>
                        <h2>Welcome back</h2>
                        <p>Sign in to your network console</p>
                    </div>
                    <!-- fills as the form is completed -->
                    <span class="lg-signal" [attr.data-level]="signalLevel" [class.is-connected]="success">
                        <span class="sg-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                        {{ signalText }}
                    </span>
                </header>

                <form (ngSubmit)="login()" class="lg-form">

                    <div class="lg-field">
                        <i class="ri-user-3-line lg-field-icon" aria-hidden="true"></i>
                        <input id="lg-username" type="text" [(ngModel)]="username" name="username"
                            placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" required />
                        <label for="lg-username">Username</label>
                    </div>

                    <div class="lg-field">
                        <i class="ri-lock-2-line lg-field-icon" aria-hidden="true"></i>
                        <input id="lg-password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password"
                            name="password" placeholder=" " autocomplete="current-password" required
                            (keydown)="checkCapsLock($event)" (keyup)="checkCapsLock($event)" (blur)="capsLock = false" />
                        <label for="lg-password">Password</label>
                        <button type="button" class="lg-eye" (click)="togglePassword()" tabindex="-1"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                        </button>
                    </div>

                    <div class="lg-caps" *ngIf="capsLock">
                        <i class="ri-arrow-up-circle-line"></i> Caps Lock is on
                    </div>

                    <button type="submit" class="lg-btn" [disabled]="loading || success" [class.is-success]="success">
                        <span *ngIf="!loading && !success" class="lg-btn-label">
                            Sign In <i class="ri-arrow-right-line"></i>
                        </span>
                        <span *ngIf="loading && !success" class="lg-btn-label">
                            <span class="lg-btn-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                            Connecting…
                        </span>
                        <span *ngIf="success" class="lg-btn-label">
                            <i class="ri-check-line"></i> Connected
                        </span>
                    </button>

                </form>

                <div *ngIf="errorMessage" class="lg-error" role="alert">
                    <i class="ri-error-warning-line"></i> {{ errorMessage }}
                </div>

                <footer class="lg-foot">
                    <span class="lg-status" [class.is-offline]="!isOnline">
                        <span class="lg-dot"></span>{{ isOnline ? 'Online' : 'Offline' }}
                    </span>
                    <small>Powered by Ranjha7star Cable Network</small>
                </footer>

            </div>
        </div>

    </div>
</div>
